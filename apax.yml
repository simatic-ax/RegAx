# General information
name: "@simatic-ax/regax"
version: 0.0.0-placeholder
author: Siemens AG
# Description will be displayed in the apax extension
description: The regax library provides a set of tools and utilities for working with regular expressions in ST (Structured Text) programming.
type: lib
#URL to the repository
repository:
  type: git
  url: https://github.com/simatic-ax/regax

# Registry information, to other npm-registries where Apax packages are located
registries:
  '@simatic-ax': 'https://npm.pkg.github.com/'
# Install settings
installStrategy: strict
apaxVersion: 3.4.2
# Dependencies
devDependencies:
  '@ax-as/s7-sdk': ^2610.0.0
  "@simatic-ax/snippetscollection": 1.1.0


# Files, which will be shipped with the library
files:
  - 'README.md'
  - 'LICENSE.md'
  - 'out/Debug/s7'
  - 'out/Debug/llvm'
  - 'docs'
  - 'snippets'
dependencies:
  "@ax-as/system-strings-lib": ^11.0.232
  "@simatic-ax/conversion": ^2610.0.0
catalogs:
  "@ax-as/s7-catalog": ^2610.0.0
